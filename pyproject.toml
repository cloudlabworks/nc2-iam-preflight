[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nc2-iam-preflight"
version = "0.1.0"
description = "Before onboarding Nutanix Cloud Clusters (NC2), ask the cloud itself which IAM permissions you are missing. Read-only; AWS, Azure and Google Cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Alvord", email = "325058966+cloudlabworks@users.noreply.github.com" }]
keywords = ["nutanix", "nc2", "iam", "aws", "azure", "gcp", "preflight", "permissions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
nc2-iam-preflight = "nc2_iam_preflight:main"

[project.urls]
Homepage = "https://cloudlabworks.dev/oss/nc2-iam-preflight"
Source = "https://github.com/cloudlabworks/nc2-iam-preflight"
Issues = "https://github.com/cloudlabworks/nc2-iam-preflight/issues"

[tool.hatch.build.targets.wheel]
packages = ["nc2_iam_preflight"]

[tool.hatch.build.targets.sdist]
exclude = ["/sources", "/live-test/results"]
